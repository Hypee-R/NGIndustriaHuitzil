<p-dialog [(visible)]="visibleDialog" [style]="{width: '400px'}" header="Lista de precios" [modal]="true" styleClass="p-fluid">

    <ng-template pTemplate="content">
       
        <ng-container >
            
            <div class="col-12 md:col-3">
                <div class="p-inputgroup">
                   Selecciona una lista de precios
                </div>
            </div>
            <br>
            <div class="row"  *ngIf="!loading">
                <p-dropdown  appendTo="body" [options]="precios" [(ngModel)]="precio" placeholder="" optionLabel="descripcion"
	                [showClear]="true"></p-dropdown>
                
            </div>
        </ng-container>

    </ng-template>

    <ng-template pTemplate="footer">
        <button pButton pRipple label="Cerrar" icon="pi pi-times" type="button" class="p-button-text" (click)="hideDialog()"></button>
        <button pButton pRipple label="Aceptar" icon="pi pi-check" class="p-button-text" (click)="closeModal()"></button>
    </ng-template>

</p-dialog>
