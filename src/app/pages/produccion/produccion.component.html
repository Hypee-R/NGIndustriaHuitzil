<div [ngClass]="{'container': statusPantalla <= 10}">

    <div class="card shadow mb-5 bg-body rounded">
        <div class="card-header text-uppercase">Producción</div>
        <span class="lstick"></span>
        <div class="card-body">
            <div class="row">
                <div class="col-12">
                    <app-loading *ngIf="loading"></app-loading>
                    <div *ngIf="!loading && listProduccion.length == 0">
                        <p-toolbar styleClass="mb-4">
                            <ng-template pTemplate="left">
                            <button 
                                class="custom-button"  
                                pButton 
                                pRipple 
                                label="Agregar" 
                                icon="pi pi-plus"
                                (click)="openModalAdd()">
                            </button>
                            </ng-template>
                        </p-toolbar>
                        <app-item-empty></app-item-empty>
                    </div>

                    <div *ngIf="!loading && listProduccion.length > 0">
                        
                        <p-table 
                            #dt 
                            [value]="listProduccion" 
                            [columns]="cols" 
                            [rows]="rows" 
                            [paginator]="true" 
                            [globalFilterFields]="['nombre','cortador']" [responsive]="true" responsiveLayout="scroll"
                            [(selection)]="selectedProduccion" 
                            [rowHover]="true" 
                            dataKey="idProduccion" 
                            currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} Cortes" 
                            [showCurrentPageReport]="true" 
                            styleClass="p-datatable-gridlines p-datatable-sm"
                            >
                            <ng-template pTemplate="caption">
                                <div class="flex align-items-center justify-content-between">                                 
                                    <div class="row">
                                   
                                        
                                        <div class="col col-md-1">
                                            <button 
                                            class="custom-button"  
                                            pButton 
                                            pRipple 
                                            label="Agregar" 
                                            icon="pi pi-plus"
                                            (click)="openModalAdd()">
                                        </button>
                                        </div>
                                        <div class="col col-md-1">
                                            <button 
                                            class="custom-button"  
                                            pButton 
                                            pRipple 
                                            label="Agregar" 
                                            icon="pi pi-plus"
                                            (click)="openModalFichaTecnica()">
                                        </button>
                                        </div>
                                        <div class="col col-md-3">
                                            <button 
                                            pButton 
                                            pRipple 
                                            label="Eliminar" 
                                            icon="pi pi-trash" 
                                            class="p-button-warning"
                                            [disabled]="
                                !selectedProduccion || !selectedProduccion.length"
                                            (click)="deleteSelectedProd()">
                                        </button>
                                        </div>
                                        
                                        <div class="col col-md-5">
                                            <span class="p-input-icon-left" style="width: 100%;">
                                            <i class="pi pi-search"></i>
                                            <input pInputText type="text" (input)="dt.filterGlobal($event.target.value, 'contains')" placeholder="Buscar..." [style]="{'width': '100%'}"/>
                                          </span>
                                        </div>
                                    </div>
                                </div>
                            </ng-template>
                            <ng-template pTemplate="header" let-columns>
                                <tr>
                                    <th style="max-width: 50px">
                                        <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                                      </th>
                                    <th *ngFor="let col of columns" [pSortableColumn]="col.field">
                                        <div class="flex justify-content-center align-items-center">
                                            {{col.header}}
                                            <p-sortIcon [field]="col.field"></p-sortIcon>
                                        </div>
                                    </th>
                                    <th>
                                        <div class="flex justify-content-center align-items-center" [ngStyle]="{'width': '11em'}">
                                            Acciones
                                        </div>
                                    </th>
                                </tr>
                                <tr>
                                    <th style="max-width: 50px">

                                    </th>
                                    <th style="width: 200px;">
                                        <p-columnFilter type="text" field="noCorte" [showMenu]="false" matchMode="contains">
                                          <ng-template pTemplate="filter" let-filter="filterCallback">
                                            <input type="text" pInputText (input)="filter($event.target.value)" />
                                          </ng-template>
                                        </p-columnFilter>
                                      </th>
                                     
                                      <th style="width: 200px;">
                                       
                                      </th>
                                </tr>
                                <tr></tr>
                            </ng-template>
                            <ng-template pTemplate="body" let-rowData let-columns="columns">
                                <tr>
                                    <td style="max-width: 50px">
                                        <p-tableCheckbox [value]="rowData"></p-tableCheckbox>
                                     </td>
                                    <td style="max-width: 100px" pEditableColumn>
                                        <p-cellEditor>
                                        <ng-template pTemplate="input">
                                            <input pInputText   type="text" (blur)="changeRowArticle(rowData)"
                                            (keydown.escape)="changeRowArticle(rowData)" (keydown.enter)="changeRowArticle(rowData)"
                                            [(ngModel)]="rowData.folio" />
                                        </ng-template>
                                        <ng-template pTemplate="output">
                                            {{ rowData.folio }}
                                        </ng-template>
                                        </p-cellEditor>
                                    </td>
                                    <td style="max-width: 100px" pEditableColumn>
                                        <p-cellEditor>
                                        <ng-template pTemplate="input">
                                            <input pInputText   type="text" (blur)="changeRowArticle(rowData)"
                                            (keydown.escape)="changeRowArticle(rowData)" (keydown.enter)="changeRowArticle(rowData)"
                                            [(ngModel)]="rowData.responsable" />
                                        </ng-template>
                                        <ng-template pTemplate="output">
                                            {{ rowData.responsable }}
                                        </ng-template>
                                        </p-cellEditor>
                                    </td>
                                   
                            
                                    <td style="max-width: 100px" >
                                      {{rowData.fechaInicio | date: 'dd/MM/yyyy, hh:mm a'}}
                                       
                                    </td>
                                   
                           
                                    <td style="max-width: 100px" pEditableColumn>
                                      {{rowData.status}}
                                      
                                    </td>
                                    <td style="max-width: 100px" pEditableColumn>
                                        <p-cellEditor>
                                        <ng-template pTemplate="input">
                                            <input pInputText   type="text" (blur)="changeRowArticle(rowData)"
                                            (keydown.escape)="changeRowArticle(rowData)" (keydown.enter)="changeRowArticle(rowData)"
                                            [(ngModel)]="rowData.comentarios" />
                                        </ng-template>
                                        <ng-template pTemplate="output">
                                            {{ rowData.comentarios }}
                                        </ng-template>
                                        </p-cellEditor>
                                    </td>
                                    <td>
                                        <div style="display: inline-flex">
                                          <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"
                                            (click)="editProduccion(rowData)"
                                            ></button>
                                          <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning"
                                            (click)="deleteProd(rowData)"
                                            style="margin-left: 3px"></button>
                
                                        </div>
                                      </td>
                                    <!--<td>
                                        <p-inputSwitch [(ngModel)]="rowData.status"
                                        (ngModelChange)="changeRowArticle(rowData)"></p-inputSwitch>
                                    </td>-->
                                  
                                </tr>
                            </ng-template>
                           
                        </p-table>
                    </div>
                    <app-add-produccion-corte
                    *ngIf="showAdd"
                    [_accion]="this.accion"
                    [_editCorte]="selectedProduccionCorte"
                    (saveProduccion)="getProduccionCortes(false)" 
                    [_articles]="articles"
                    [_articulosProduccion]="articleProduccion"
                    [_materialesProduccion]="materialProduccion"
                    ></app-add-produccion-corte>
                   
                </div>
            </div>
        </div>
    </div>

</div>
